# Collects new research from OpenAlex, rebuilds the data and publishes the site to GitHub Pages.
# Runs every morning (6 AM Eastern) and rereads the course catalog on the 1st of each month. Also runs whenever someone presses "Run workflow" on the Actions tab,
# and whenever a change is pushed (for example an edit to data/exclude.csv).
name: Update and publish the map

on:
  schedule:
    - cron: "0 10 * * *"   # every morning: research updates
    - cron: "0 9 1 * *"    # 1st of the month: also reread the course catalog
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r pipeline/requirements.txt

      # Stops the update if the catalog reader no longer handles the tricky program pages correctly
      - name: Check the catalog reader
        run: python -m unittest discover pipeline/tests

      # The catalog changes about once a year, so it's only read on the 1st of the month or when run by hand
      - name: Read the course catalog
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 1 * *'
        run: python pipeline/curriculum/scrape_catalog.py

      - name: Collect new research from OpenAlex
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python pipeline/scrape_openalex.py

      - name: Build the curriculum data
        run: python pipeline/curriculum/build_curriculum.py

      - name: Build the map data
        run: python pipeline/build_data.py

      - name: Save the updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/public/data
          git diff --cached --quiet || git commit -m "Update research data from OpenAlex"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
